<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Advanced Booster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --purple:#7c6bb8; --purple-dark:#5f4fa1; --ink:#2b2b3a; --bg:#f8f9fc; --error:#d9534f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100vh; }
  body { font-family:'Inter','Segoe UI',-apple-system,Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:440px; background:#fff; border-radius:28px; padding:36px 36px 34px; text-align:center; box-shadow:0 20px 60px rgba(124,107,184,0.12); }
  .logo { width:64px; height:64px; margin:0 auto 20px; display:block; }
  h2 { color:var(--purple); font-size:22px; font-weight:800; margin-bottom:6px; }
  p { color:#6b7280; font-size:15px; margin-bottom:20px; }
  input[type=password], input[type=text] { width:100%; padding:13px 16px; font:inherit; font-size:17px; border:2px solid var(--purple); border-radius:14px; outline:none; box-shadow:0 0 0 5px rgba(124,107,184,0.12); color:var(--ink); background:#fff; }
  input.shake { border-color:var(--error); box-shadow:0 0 0 5px rgba(217,83,79,0.12); animation:shake .35s; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .remember { display:inline-flex; align-items:center; gap:10px; margin:14px 0 16px; color:#6b7280; font-size:14px; cursor:pointer; }
  .remember input { width:16px; height:16px; accent-color:var(--purple); }
  button { width:100%; padding:13px; border:none; border-radius:14px; background:var(--purple); color:#fff; font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:background .2s; }
  button:hover { background:var(--purple-dark); }
  button:disabled { opacity:.7; cursor:wait; }
  .err { color:var(--error); font-size:13px; font-weight:600; min-height:0; margin-top:10px; }
  html.ab-auto .card { visibility:hidden; }
  @media (max-width:520px){ .card { padding:30px 22px 32px; } input[type=password] { font-size:16px; } }
</style>
</head>
<body>
<div class="card" id="gate">
  <svg class="logo" viewBox="0 0 100 100" aria-label="Advanced Booster logo">
    <circle cx="50" cy="50" r="48" fill="#7c6bb8"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 20 C59 29 63 40 63 49 C63 57 60 64 55 69 L45 69 C40 64 37 57 37 49 C37 40 41 29 50 20 Z"/>
      <circle cx="50" cy="45" r="6"/>
      <path d="M37 53 L27 65 L37 65"/><path d="M63 53 L73 65 L63 65"/>
      <path d="M42 76 q4 4 8 0 q4 4 8 0"/>
    </g>
  </svg>
  <h2>Advanced Booster</h2>
  <p>This page is password protected.</p>
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password" autofocus>
  <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
  <button type="button" id="btn">Enter</button>
  <div class="err" id="err"></div>
</div>

  var SALT = "EBEwEpKy/eCYLEC3lTmNHg==";
  var IV = "htwnYTHuBfqz/TiL";
  var ITER = 600000;
  var DAYS = 30;
  var STORE = "ab_key_" + SALT.slice(0, 10).replace(/[^A-Za-z0-9]/g, "");

  var $ = function(id){ return document.getElementById(id); };
  var fromB64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  var toB64 = function(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); };

  async function deriveKey(pass){
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: fromB64(SALT), iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
    );
  }
  async function decrypt(key){
    var buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: fromB64(IV) }, key, fromB64(PAYLOAD));
    return new TextDecoder().decode(buf);
  }
  function show(html){
    document.open();
    document.write(html);
    document.close();
  }

  // Auto-login from saved key (runs only after the wrapper page has fully loaded,
  // otherwise document.write would mix with the still-parsing wrapper)
  function autoLogin(){
    (async function(){
      try {
        var saved = JSON.parse(localStorage.getItem(STORE) || "null");
        if (!saved || saved.exp < Date.now()) { localStorage.removeItem(STORE); document.documentElement.classList.remove("ab-auto"); return; }
        var key = await crypto.subtle.importKey("raw", fromB64(saved.k), "AES-GCM", false, ["decrypt"]);
        show(await decrypt(key));
      } catch (e) {
        try { localStorage.removeItem(STORE); } catch (_) {}
        document.documentElement.classList.remove("ab-auto");
      }
    })();
  }
  try { if (localStorage.getItem(STORE)) document.documentElement.classList.add("ab-auto"); } catch (e) {}
  if (document.readyState === "complete") autoLogin();
  else window.addEventListener("load", autoLogin);

  async function enter(){
    var input = $("pass"), err = $("err"), btn = $("btn");
    if (!input.value) { input.focus(); return; }
    if (!window.crypto || !crypto.subtle) { err.textContent = "Please open this page via https://"; return; }
    btn.disabled = true; err.textContent = "";
    try {
      var key = await deriveKey(input.value);
      var html = await decrypt(key);
      if ($("remember").checked) {
        try {
          var raw = await crypto.subtle.exportKey("raw", key);
          localStorage.setItem(STORE, JSON.stringify({ k: toB64(raw), exp: Date.now() + DAYS * 864e5 }));
        } catch (e) {}
      }
      show(html);
    } catch (e) {
      err.textContent = "Incorrect password. Please try again.";
      input.classList.remove("shake"); void input.offsetWidth; input.classList.add("shake");
      input.select();
      btn.disabled = false;
    }
  }
  $("btn").addEventListener("click", enter);
  $("pass").addEventListener("keydown", function(e){ if (e.key === "Enter") enter(); });
  $("pass").addEventListener("input", function(){ $("err").textContent = ""; this.classList.remove("shake"); });
