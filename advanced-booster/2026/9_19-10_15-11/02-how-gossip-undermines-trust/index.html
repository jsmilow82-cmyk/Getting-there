<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Advanced Booster</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --purple:#7c6bb8; --purple-dark:#5f4fa1; --ink:#2b2b3a; --bg:#f8f9fc; --error:#d9534f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { min-height:100vh; }
  body { font-family:'Inter','Segoe UI',-apple-system,Arial,sans-serif; background:var(--bg); color:var(--ink); display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  .card { width:100%; max-width:440px; background:#fff; border-radius:28px; padding:36px 36px 34px; text-align:center; box-shadow:0 20px 60px rgba(124,107,184,0.12); }
  .logo { width:64px; height:64px; margin:0 auto 20px; display:block; }
  h2 { color:var(--purple); font-size:22px; font-weight:800; margin-bottom:6px; }
  p { color:#6b7280; font-size:15px; margin-bottom:20px; }
  input[type=password], input[type=text] { width:100%; padding:13px 16px; font:inherit; font-size:17px; border:2px solid var(--purple); border-radius:14px; outline:none; box-shadow:0 0 0 5px rgba(124,107,184,0.12); color:var(--ink); background:#fff; }
  input.shake { border-color:var(--error); box-shadow:0 0 0 5px rgba(217,83,79,0.12); animation:shake .35s; }
  @keyframes shake { 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
  .remember { display:inline-flex; align-items:center; gap:10px; margin:14px 0 16px; color:#6b7280; font-size:14px; cursor:pointer; }
  .remember input { width:16px; height:16px; accent-color:var(--purple); }
  button { width:100%; padding:13px; border:none; border-radius:14px; background:var(--purple); color:#fff; font:inherit; font-size:16px; font-weight:700; cursor:pointer; transition:background .2s; }
  button:hover { background:var(--purple-dark); }
  button:disabled { opacity:.7; cursor:wait; }
  .err { color:var(--error); font-size:13px; font-weight:600; min-height:0; margin-top:10px; }
  html.ab-auto .card { visibility:hidden; }
  @media (max-width:520px){ .card { padding:30px 22px 32px; } input[type=password] { font-size:16px; } }
</style>
</head>
<body>
<div class="card" id="gate">
  <svg class="logo" viewBox="0 0 100 100" aria-label="Advanced Booster logo">
    <circle cx="50" cy="50" r="48" fill="#7c6bb8"/>
    <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M50 20 C59 29 63 40 63 49 C63 57 60 64 55 69 L45 69 C40 64 37 57 37 49 C37 40 41 29 50 20 Z"/>
      <circle cx="50" cy="45" r="6"/>
      <path d="M37 53 L27 65 L37 65"/><path d="M63 53 L73 65 L63 65"/>
      <path d="M42 76 q4 4 8 0 q4 4 8 0"/>
    </g>
  </svg>
  <h2>Advanced Booster</h2>
  <p>This page is password protected.</p>
  <input type="password" id="pass" placeholder="Password" autocomplete="current-password" autofocus>
  <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
  <button type="button" id="btn">Enter</button>
  <div class="err" id="err"></div>
</div>

  var LS='ab_lock_pwd';
  var root=document.documentElement;
  var passEl=document.getElementById('pass'),remEl=document.getElementById('remember'),btn=document.getElementById('btn'),errEl=document.getElementById('err');
  function b64buf(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return u;}
  function decrypt(pwd){
    var enc=new TextEncoder(),dec=new TextDecoder();
    return crypto.subtle.importKey('raw',enc.encode(pwd),'PBKDF2',false,['deriveKey']).then(function(m){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64buf(P.s),iterations:150000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64buf(P.i)},key,b64buf(P.c));
    }).then(function(pt){return dec.decode(pt);});
  }
  function render(page){document.open();document.write(page);document.close();}
  function fail(auto){
    root.classList.remove('ab-auto');
    btn.disabled=false;btn.textContent='Enter';
    if(auto){localStorage.removeItem(LS);remEl.checked=false;passEl.value='';}
    else{
      errEl.textContent='Wrong password — please try again.';
      passEl.classList.remove('shake');void passEl.offsetWidth;passEl.classList.add('shake');
      passEl.focus();passEl.select();
    }

  function unlock(pwd,auto){
    if(!auto){btn.disabled=true;btn.textContent='Unlocking…';errEl.textContent='';}
    decrypt(pwd).then(function(page){
      if(remEl.checked)localStorage.setItem(LS,pwd);else localStorage.removeItem(LS);

  }
  function submit(){var v=passEl.value;if(!v){passEl.focus();return;}unlock(v,false);}
  btn.addEventListener('click',submit);
  passEl.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();submit();}});

  if(saved){root.classList.add('ab-auto');remEl.checked=true;unlock(saved,true);}
