<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>The Door Mix-Up | Maria and the City | Brooklyn School of English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .lesson-page{
    padding-top:28px;
    padding-bottom:80px;
  }

  .lesson-intro{
    max-width:760px;
    margin:34px auto 42px;
    text-align:center;
  }

  .lesson-intro .eyebrow{
    display:block;
    margin-bottom:10px;
    color:var(--orange);
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
  }

  .lesson-intro h1{
    margin:0 0 14px;
    font-family:var(--display);
    font-size:clamp(2.7rem,6vw,4.8rem);
    font-weight:400;
    line-height:1;
    color:var(--blue);
  }

  .lesson-intro p{
    max-width:640px;
    margin:0 auto;
    color:var(--ink-soft);
    font-size:1.05rem;
    line-height:1.65;
  }

  .app{
    max-width:820px;
    margin:0 auto;
  }

  .card{
    border:1px solid var(--rule);
    background:rgba(255,255,255,.58);
    padding:24px;
    margin:18px 0;
  }

  .card h2{
    color:var(--blue);
    font-family:var(--display);
    font-weight:500;
  }

  audio{
    width:100%;
    margin:12px 0 8px;
  }

  .controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:12px 0;
    align-items:center;
  }

  button{
    padding:10px 15px;
    font:inherit;
    font-size:14px;
    font-weight:600;
    border:1px solid var(--blue);
    background:var(--blue);
    color:#fff;
    cursor:pointer;
    transition:transform .2s ease,background .2s ease,color .2s ease;
  }

  button:hover{
    transform:translateY(-1px);
    background:var(--orange);
    border-color:var(--orange);
  }

  .hidden{display:none;}

  .prompt{
    margin:6px 0 14px;
    font-size:16px;
    color:var(--ink);
  }

  .options{
    display:grid;
    gap:10px;
    margin-top:10px;
  }

  label{
    display:flex;
    gap:9px;
    align-items:flex-start;
    cursor:pointer;
  }

  .row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  input[type="text"],
  select{
    padding:9px 11px;
    border:1px solid var(--rule);
    background:#fff;
    font:inherit;
    font-size:15px;
  }

  input[type="text"]{
    width:260px;
  }

  .feedback{
    margin-top:14px;
    padding:13px 14px;
    border:1px solid var(--rule);
    background:rgba(255,255,255,.7);
    display:none;
  }

  .feedback.good{
    border-left:4px solid #5f9b68;
  }

  .feedback.bad{
    border-left:4px solid #c8655c;
  }

  .note{
    margin-top:10px;
    font-size:14px;
    color:var(--ink-soft);
  }

  .dialogueArea{
    margin-top:14px;
  }

  .line{
    opacity:0;
    transform:translateY(4px);
    transition:opacity 200ms ease,transform 200ms ease;
    margin:7px 0;
    padding:0;
    border:none;
    box-shadow:none;
    background:transparent;
    cursor:pointer;
  }

  .line.visible{opacity:1;transform:translateY(0);}
  .line.past{opacity:.58;}

  .line.current{
    opacity:1;
    padding-left:12px;
    border-left:3px solid var(--orange);
  }

  .speaker{
    font-weight:700;
    margin-right:6px;
  }

  .maria .speaker{color:var(--blue);}
  .dave .speaker{color:#7a4f89;}

  .dialogueArea,.dialogueArea *{
    border-top:none!important;
    border-bottom:none!important;
    box-shadow:none!important;
    background-image:none!important;
  }

  .dialogueArea hr{
    display:none!important;
  }

  @media (max-width:650px){
    .lesson-page{padding-top:18px;}
    .lesson-intro{margin:26px auto 32px;text-align:left;}
    .card{padding:20px 18px;}
    input[type="text"],select{
      width:100%;
      max-width:100%;
      box-sizing:border-box;
    }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="shell masthead-inner">
    <a class="brand" href="bse.html">
      <img class="brand-logo" src="brooklyn-bridge-icon.png" alt="Brooklyn School of English logo" />
      <span class="brand-text">
        <span class="wordmark">Brooklyn School of English</span>
        <span class="brand-sub">New York</span>
      </span>
    </a>

    <span class="masthead-note">Maria and the City</span>
  </div>
</header>

<main class="shell lesson-page">

  <a class="back-link" href="maria-and-the-city.html">
    ← Maria and the City
  </a>

  <section class="lesson-intro">
    <span class="eyebrow">Story 02</span>
    <h1>The Door Mix-Up</h1>
    <p>
      Maria arrives at what she thinks is her rental apartment and accidentally
      meets her new neighbor Dave.
    </p>
  </section>

  <div class="app" id="app"></div>

</main>

<footer>
  <div class="shell footer-inner">
    <span>© 2026 Brooklyn School of English</span>
    <span>New York</span>
  </div>
</footer>

<script>
(() => {
  const uid = "l2_" + Math.random().toString(16).slice(2);

  // Put audio/lesson-02.mp3 in the SAME folder as this index.html
  const mp3 = "audio/lesson-02.mp3";
const TIME_SCALE = 0.90;   // < 1 makes transcript happen earlier (audio is ahead)
const TIME_OFFSET = 0.00;  // seconds; use -0.5 if it’s still a bit late everywhere
const T = (t) => (t * TIME_SCALE) + TIME_OFFSET;

  // ✅ Removed the “tries to open the door” line
  // ✅ Shifted all later timestamps earlier to keep alignment (edit as needed)
  const dialogueLines = [
    { t: 0.0,  speaker: "Maria", cls:"maria", text: "1-2-3-4?! How stupid!" },
    { t: 4.5,  speaker: "Maria", cls:"maria", text: "(in Russian) Come on you stupid door; open!" },
    { t: 8.5,  speaker: "Dave",  cls:"dave",  text: "Hey!" },
    { t: 10.5, speaker: "Maria", cls:"maria", text: "Oh my god! Don’t hurt me!" },
    { t: 14.5, speaker: "Dave",  cls:"dave",  text: "What? I’m not going to hurt you, I just want to know why you’re trying to break into my apartment." },
    { t: 23.0, speaker: "Maria", cls:"maria", text: "Your apartment?! Oh, there must be some mix up. Um, I’m looking for my Air B&B. It’s 1026 Manhattan Avenue. Am I at the right place?" },
    { t: 36.0, speaker: "Dave",  cls:"dave",  text: "You sure are. But you must be looking for 1026 A, this is 1026 B. You’re just next door." },
    { t: 46.0, speaker: "Maria", cls:"maria", text: "Oh thanks. Sorry, this must be your door then, haha. What a funny thing to happen: you thought I was trying to break in and rob your place and I thought you were going to mug me." },
    { t: 62.0, speaker: "Dave",  cls:"dave",  text: "Haha, yeah. Nope I’m just your new neighbor. Anyway, do I look like someone who goes around mugging people?" },
    { t: 71.0, speaker: "Maria", cls:"maria", text: "Well, I don’t know. I’ve never been mugged before so… Do I look like someone who breaks into people’s houses?" },
    { t: 80.0, speaker: "Dave",  cls:"dave",  text: "No! I mean, no, of course not. Actually you look really…um, yeah." },
    { t: 88.0, speaker: "Maria", cls:"maria", text: "Anyway, speaking of crime; Is this neighborhood safe?" },
    { t: 94.0, speaker: "Dave",  cls:"dave",  text: "Yeah. I know some buildings look a little run-down, but it’s actually a really safe neighborhood." },
    { t: 101.0, speaker: "Maria", cls:"maria", text: "Great to know." },
    { t: 103.0, speaker: "Dave",  cls:"dave",  text: "Oh, actually, there was a burglary in that luxury boutique over there on the corner. They say the thieves stole over $300,000 worth of designer clothes." },
    { t: 115.0, speaker: "Maria", cls:"maria", text: "Wow, that’s crazy!" },
    { t: 118.0, speaker: "Dave",  cls:"dave",  text: "Yeah, that’s a typical Greenpoint crime I guess." },
    { t: 122.0, speaker: "Maria", cls:"maria", text: "Haha. I’m Maria by the way." },
    { t: 126.0, speaker: "Dave",  cls:"dave",  text: "Hi, I’m Dave, nice to meet you. Well, now that you got into your place, do you need help with anything else?" },
    { t: 134.0, speaker: "Maria", cls:"maria", text: "Thanks, nothing right now, but I know you’re just next door in apartment B if I ever need anything." },
    { t: 142.0, speaker: "Dave",  cls:"dave",  text: "Yup, I’ll be here. Well, goodnight." }
  ];

  const el = document.getElementById("app");
  el.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">Audio</h2>
      <audio id="${uid}_audio" controls preload="metadata">
        <source src="${mp3}" type="audio/mpeg" />
        Your browser can’t play this audio.
      </audio>

      <div class="controls">
        <button id="${uid}_show" type="button">Show dialogue</button>
        <button id="${uid}_hide" type="button" class="hidden">Hide dialogue</button>
        <button id="${uid}_full" type="button" class="hidden">Show full transcript</button>
      </div>

      <div id="${uid}_dlg" class="dialogueArea hidden" aria-live="polite"></div>
      <div class="note">Tip: click a revealed line to jump to that moment.</div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">1) Comprehension</h2>
      <p class="prompt"><strong>Why did Maria and Dave start talking about crime?</strong></p>
      <div class="options">
        <label><input type="radio" name="${uid}_crime" value="a"> Maria was trying to break into Dave’s apartment.</label>
        <label><input type="radio" name="${uid}_crime" value="b"> Maria wanted to know if the neighborhood was safe.</label>
        <label><input type="radio" name="${uid}_crime" value="c"> Someone had just stolen expensive clothes from a shop.</label>
        <label><input type="radio" name="${uid}_crime" value="d"> Maria thought the apartment she’s renting got robbed.</label>
      </div>
      <button id="${uid}_crime_check" type="button" style="margin-top:14px;">Check answer</button>
      <div id="${uid}_crime_fb" class="feedback" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">2) Match the crime</h2>
      <p class="prompt"><strong>Match the crime with its description.</strong></p>

      <div class="row" style="margin-top:10px;">
        <strong style="min-width:90px;">Burglary</strong>
        <select id="${uid}_m1">
          <option value="">Choose…</option>
          <option value="a">stealing from a home or business that involves breaking in</option>
          <option value="b">entering someone’s property illegally</option>
          <option value="c">stealing from someone in public, using threats or violence</option>
        </select>
      </div>

      <div class="row" style="margin-top:10px;">
        <strong style="min-width:90px;">Break in</strong>
        <select id="${uid}_m2">
          <option value="">Choose…</option>
          <option value="a">stealing from a home or business that involves breaking in</option>
          <option value="b">entering someone’s property illegally</option>
          <option value="c">stealing from someone in public, using threats or violence</option>
        </select>
      </div>

      <div class="row" style="margin-top:10px;">
        <strong style="min-width:90px;">Mugging</strong>
        <select id="${uid}_m3">
          <option value="">Choose…</option>
          <option value="a">stealing from a home or business that involves breaking in</option>
          <option value="b">entering someone’s property illegally</option>
          <option value="c">stealing from someone in public, using threats or violence</option>
        </select>
      </div>

      <button id="${uid}_match_check" type="button" style="margin-top:14px;">Check answers</button>
      <div id="${uid}_match_fb" class="feedback" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">3) break in / break into</h2>
      <p class="prompt"><strong>Choose the correct explanation.</strong></p>

      <div class="options">
        <label><input type="radio" name="${uid}_phrasal" value="a">
          <strong>break into</strong> + building (object). <strong>break in</strong> = no object.
        </label>
        <label><input type="radio" name="${uid}_phrasal" value="b">
          <strong>break in</strong> + building (object). <strong>break into</strong> = no object.
        </label>
        <label><input type="radio" name="${uid}_phrasal" value="c">
          They mean the same thing and are always interchangeable.
        </label>
      </div>

      <div class="note">
        Examples: “break into my apartment” (object) vs “trying to break in” (no object).
      </div>

      <button id="${uid}_phrasal_check" type="button" style="margin-top:14px;">Check answer</button>
      <div id="${uid}_phrasal_fb" class="feedback" aria-live="polite"></div>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;font-size:18px;">4) Safe / Safety</h2>
      <p class="prompt"><strong>Choose the correct option.</strong></p>

      <div class="options">
        <label><input type="radio" name="${uid}_pos" value="a"> Safe / Safety is an adjective.</label>
        <label><input type="radio" name="${uid}_pos" value="b"> Safety / Safe is a noun.</label>
      </div>

      <button id="${uid}_pos_check" type="button" style="margin-top:14px;">Check answer</button>
      <div id="${uid}_pos_fb" class="feedback" aria-live="polite"></div>

      <div style="margin-top:14px;">
        <p class="prompt"><strong>Fill in the gap with <em>safe</em> or <em>safety</em>.</strong></p>
        <div class="row">
          <span>I never really feel</span>
          <input id="${uid}_g1" type="text" placeholder="safe / safety" autocomplete="off" />
          <span>in this neighborhood, especially at night.</span>
        </div>
        <div class="row" style="margin-top:10px;">
          <span>I can’t believe we had to sit through a two hour seminar on office</span>
          <input id="${uid}_g2" type="text" placeholder="safe / safety" autocomplete="off" />
          <span>today at work.</span>
        </div>

        <button id="${uid}_g_check" type="button" style="margin-top:14px;">Check answers</button>
        <div id="${uid}_g_fb" class="feedback" aria-live="polite"></div>
      </div>
      <div class="card">
  <h2 style="margin:0 0 8px;font-size:18px;">5) Vocabulary: run-down</h2>
  <p class="prompt"><strong>Which sentence best describes a run-down place?</strong></p>

  <div class="options">
    <label>
      <input type="radio" name="rundown" value="a">
      The apartment was a mess; there were dirty clothes and dishes everywhere.
    </label>
    <label>
      <input type="radio" name="rundown" value="b">
      The house was nearly completely destroyed by the fire.
    </label>
    <label>
      <input type="radio" name="rundown" value="c">
      The building has a few broken windows and needs to be repainted.
    </label>
  </div>

  <button id="rundown-check" type="button" style="margin-top:14px;">
    Check answer
  </button>

  <div id="rundown-feedback" class="feedback" aria-live="polite"></div>
</div>
    </div>
  `;

  /* -------- Transcript engine -------- */
  const audio = document.getElementById(`${uid}_audio`);
  const dlg = document.getElementById(`${uid}_dlg`);
  const showBtn = document.getElementById(`${uid}_show`);
  const hideBtn = document.getElementById(`${uid}_hide`);
  const fullBtn = document.getElementById(`${uid}_full`);

  let enabled = false, lastShown = -1, currentIdx = -1;

  const nodes = dialogueLines.map(line => {
    const div = document.createElement("div");
    div.className = `line ${line.cls}`;
    div.innerHTML = `<span class="speaker">${line.speaker}:</span><span>${line.text}</span>`;
    div.addEventListener("click", () => { audio.currentTime = T(line.t);
 audio.play(); });
    dlg.appendChild(div);
    return div;
  });

  function clearStates(){
    nodes.forEach(n => n.classList.remove("visible","past","current"));
    lastShown = -1; currentIdx = -1;
  }
  function setCurrent(idx){
    if (currentIdx === idx) return;
    if (currentIdx >= 0){ nodes[currentIdx].classList.remove("current"); nodes[currentIdx].classList.add("past"); }
    currentIdx = idx;
    nodes[currentIdx].classList.add("current","visible");
    nodes[currentIdx].classList.remove("past");
  }
  function revealUpTo(t){
    if (!enabled) return;
    while (lastShown + 1 < dialogueLines.length && T(dialogueLines[lastShown + 1].t) <= t + 0.05
){
      lastShown++;
      nodes[lastShown].classList.add("visible","past");
      nodes[lastShown].classList.remove("current");
    }
    let idx = -1;
    for (let i=0;i<dialogueLines.length;i++){ if (T(dialogueLines[i].t) <= t + 0.05) idx = i;
 else break; }
    if (idx >= 0 && idx <= lastShown) setCurrent(idx);
  }

  audio.addEventListener("timeupdate", () => revealUpTo(audio.currentTime));
  audio.addEventListener("seeked", () => { if (enabled) { clearStates(); revealUpTo(audio.currentTime); } });

  showBtn.addEventListener("click", () => {
    enabled = true;
    dlg.classList.remove("hidden");
    showBtn.classList.add("hidden");
    hideBtn.classList.remove("hidden");
    fullBtn.classList.remove("hidden");
    clearStates();
    revealUpTo(audio.currentTime);
  });

  hideBtn.addEventListener("click", () => {
    enabled = false;
    dlg.classList.add("hidden");
    showBtn.classList.remove("hidden");
    hideBtn.classList.add("hidden");
    fullBtn.classList.add("hidden");
    clearStates();
  });

  fullBtn.addEventListener("click", () => {
    if (!enabled) return;
    nodes.forEach(n => { n.classList.add("visible","past"); n.classList.remove("current"); });
    lastShown = nodes.length - 1; currentIdx = -1;
  });

  /* -------- Helpers -------- */
  const norm = s => (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[.?!,;:()"']/g,"");

  /* -------- EX1: Comprehension (answer = b) -------- */
  const crimeFb = document.getElementById(`${uid}_crime_fb`);
  document.getElementById(`${uid}_crime_check`).addEventListener("click", () => {
    const sel = document.querySelector(`input[name="${uid}_crime"]:checked`);
    crimeFb.style.display = "block";
    if (!sel){ crimeFb.className = "feedback bad"; crimeFb.textContent = "Choose one option first 🙂"; return; }
    if (sel.value === "b"){
      crimeFb.className = "feedback good";
      crimeFb.textContent = "✅ Correct!";
    } else {
      crimeFb.className = "feedback bad";
      crimeFb.innerHTML = `❌ Not quite.<div class="note">Correct answer: <strong>Maria wanted to know if the neighborhood was safe.</strong></div>`;
    }
  });

  /* -------- EX2: Matching -------- */
  const matchFb = document.getElementById(`${uid}_match_fb`);
  document.getElementById(`${uid}_match_check`).addEventListener("click", () => {
    const m1 = document.getElementById(`${uid}_m1`);
    const m2 = document.getElementById(`${uid}_m2`);
    const m3 = document.getElementById(`${uid}_m3`);
    const ok = (m1.value==="a" && m2.value==="b" && m3.value==="c");

    matchFb.style.display = "block";
    if (!m1.value || !m2.value || !m3.value){
      matchFb.className = "feedback bad";
      matchFb.textContent = "Choose an option for each one 🙂";
      return;
    }
    if (ok){
      matchFb.className = "feedback good";
      matchFb.textContent = "✅ All correct!";
    } else {
      matchFb.className = "feedback bad";
      matchFb.innerHTML = `❌ Not quite.<div class="note">
        Correct matches:<br>
        <strong>Burglary</strong> → stealing from a home or business that involves breaking in<br>
        <strong>Break in</strong> → entering someone’s property illegally<br>
        <strong>Mugging</strong> → stealing from someone in public, using threats or violence
      </div>`;
    }
  });

  /* -------- EX3: Phrasal verbs -------- */
  const phFb = document.getElementById(`${uid}_phrasal_fb`);
  document.getElementById(`${uid}_phrasal_check`).addEventListener("click", () => {
    const sel = document.querySelector(`input[name="${uid}_phrasal"]:checked`);
    phFb.style.display = "block";
    if (!sel){ phFb.className = "feedback bad"; phFb.textContent = "Choose one option first 🙂"; return; }
    if (sel.value === "a"){
      phFb.className = "feedback good";
      phFb.textContent = "✅ Correct!";
    } else {
      phFb.className = "feedback bad";
      phFb.innerHTML = `❌ Not quite.<div class="note">Correct: <strong>break into + building</strong> (object); <strong>break in</strong> (no object).</div>`;
    }
  });

  /* -------- EX4: Safe/Safety POS -------- */
  const posFb = document.getElementById(`${uid}_pos_fb`);
  document.getElementById(`${uid}_pos_check`).addEventListener("click", () => {
    const sel = document.querySelector(`input[name="${uid}_pos"]:checked`);
    posFb.style.display = "block";
    if (!sel){ posFb.className = "feedback bad"; posFb.textContent = "Choose one option first 🙂"; return; }
    if (sel.value === "b"){
      posFb.className = "feedback good";
      posFb.textContent = "✅ Correct! Safety is a noun; safe is an adjective.";
    } else {
      posFb.className = "feedback bad";
      posFb.innerHTML = `❌ Not quite.<div class="note">Correct: <strong>Safety</strong> is a noun; <strong>safe</strong> is an adjective.</div>`;
    }
  });

  /* -------- EX4b: Fill gaps -------- */
  const gFb = document.getElementById(`${uid}_g_fb`);
  document.getElementById(`${uid}_g_check`).addEventListener("click", () => {
    const g1 = document.getElementById(`${uid}_g1`);
    const g2 = document.getElementById(`${uid}_g2`);
    const a1 = norm(g1.value), a2 = norm(g2.value);

    gFb.style.display = "block";

    let ok1 = (a1 === "safe"), ok2 = (a2 === "safety");
    g1.style.borderColor = ok1 ? "#7cc47c" : "#e07a7a";
    g2.style.borderColor = ok2 ? "#7cc47c" : "#e07a7a";

    if (!a1 || !a2){
      gFb.className = "feedback bad";
      gFb.textContent = "Fill in both gaps first 🙂";
      return;
    }

    if (ok1 && ok2){
      gFb.className = "feedback good";
      gFb.textContent = "✅ Correct!";
    } else {
      gFb.className = "feedback bad";
      gFb.innerHTML = `❌ Not quite.<div class="note">Answers: <strong>safe</strong> (1), <strong>safety</strong> (2).</div>`;
    }
  });
  document.getElementById("rundown-check").addEventListener("click", () => {
  const fb = document.getElementById("rundown-feedback");
  const sel = document.querySelector('input[name="rundown"]:checked');

  fb.style.display = "block";

  if (!sel) {
    fb.className = "feedback bad";
    fb.textContent = "Choose one option first 🙂";
    return;
  }

  if (sel.value === "c") {
    fb.className = "feedback good";
    fb.innerHTML = `
      ✅ Correct!<br><br>
      <strong>Explanation:</strong><br>
      <em>Run-down</em> is used to talk about structures (houses, buildings, etc.) 
      and means it is in bad condition, usually because it is old and not properly maintained.
    `;
  } else {
    fb.className = "feedback bad";
    fb.innerHTML = `
