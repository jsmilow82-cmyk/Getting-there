<main><header><small>ENGLISH VOCABULARY PRACTICE</small><h1>Collocations: innovation</h1><p>Three exercises · 26 questions</p></header><div id="tasks"></div></main>

['Small companies often @ when they receive the right support.','thrive','thrive|herald|lead'],

function gap(key,options,n,letters=false,alt=''){
return '<select aria-label="Answer '+n+'" data-key="'+key+'" data-alt="'+alt+'"><option value="">'+n+' · Choose…</option>'+options.split('|').map((x,i)=>'<option value="'+x+'">'+(letters?'abc'[i]+'. ':'')+x+'</option>').join('')+'</select>';
}
const list=(rows,words)=>'<ol>'+rows.map(([s,k,o],i)=>'<li>'+s.replace('@',gap(k,o||words,i+1,false,words?(i===1?'cutting-edge':i===5?'groundbreaking':''):''))+'</li>').join('')+'</ol>';
let i=0;
